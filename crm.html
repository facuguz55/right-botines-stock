<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060A10" />
    <link rel="manifest" href="/manifest-crm.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Right CRM" />
    <title>Right CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&family=Inter:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"><p id="crm-arranque" style="margin:0;padding:24px;font:15px system-ui,sans-serif;color:#9ba2ad">Cargando el CRM…</p></div>
    <script>
      // Si algo falla antes de que arranque la app, en vez de dejar la pantalla
      // vacía se muestra el motivo (sirve para revisar desde el celular).
      (function () {
        function mostrar(msg) {
          var el = document.getElementById('crm-arranque')
          if (el) el.textContent = 'No se pudo abrir el CRM: ' + msg
        }
        window.addEventListener('error', function (e) { mostrar(e.message || 'error de carga') })
        window.addEventListener('unhandledrejection', function (e) { mostrar(String((e.reason && e.reason.message) || e.reason)) })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
